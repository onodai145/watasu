services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - app-data:/app/data
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  # PostgreSQL を使う場合は以下のコメントを外して .env で DB_CLIENT=pg を設定
